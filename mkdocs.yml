site_name: Nicolas Férey
site_description: Maître de conférences en informatique, LISN / IUT d'Orsay — Université Paris-Saclay
site_author: Nicolas Férey
site_url: https://nicolasferey.github.io/
copyright: © 2026 Nicolas Férey

theme:
  name: material
  language: fr
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.tabs.link
    - toc.integrate
  icon:
    logo: material/cube-scan

# Pas de recherche : le site est court
plugins: []

nav:
  - Accueil: index.md
  - Recherche:
      - Publications: publications.md
      - Projets:
          - projets/index.md
          - ANR PIRATE: projets/pirate.md
          - BioTIN'INT: projets/biotinint.md
          - UCB BioPharma: projets/ucb-biopharma.md
          - FluidMeAT: projets/fluidmeat.md
          - ANR ExaViz: projets/exaviz.md
      - Logiciels:
          - logiciels/index.md
          - BioSpring: logiciels/biospring.md
          - UnityMol: logiciels/unitymol.md
          - Interface tangible: logiciels/interface-tangible.md
          - Salle de TP RV: logiciels/salle-tp-rv.md
  - Enseignement: enseignement.md

extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/mail.js
  - javascripts/a11y.js

extra:
  social:
    - icon: fontawesome/brands/orcid
      link: https://orcid.org/0000-0002-7713-001X
      name: ORCID
    - icon: material/file-document-multiple
      link: https://cv.hal.science/nicolas-ferey
      name: HAL
    - icon: fontawesome/solid/graduation-cap
      link: https://scholar.google.com/citations?user=lXethhQAAAAJ
      name: Google Scholar
    - icon: fontawesome/brands/github
      link: https://github.com/nicolasferey
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/nicolas-ferey-67473118/
      name: LinkedIn

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
